<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login - Unnecessary Engineering</title>


<style>

body {

    margin:0;
    font-family:Arial,sans-serif;
    background:#0f0f0f;
    color:white;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;

}


.container {

    background:#1a1a1a;

    width:90%;
    max-width:420px;

    padding:40px;

    border-radius:12px;

    box-shadow:
    0 10px 20px rgba(0,255,204,0.2);

    text-align:center;

}


h1 {

    font-size:2em;

    margin-bottom:10px;

}


.subtitle {

    color:#cccccc;

    margin-bottom:30px;

}


input {

    width:100%;

    box-sizing:border-box;

    padding:14px;

    margin-bottom:15px;

    border-radius:8px;

    border:none;

    background:#2a2a2a;

    color:white;

    font-size:1em;

}


input:focus {

    outline:2px solid #00ffcc;

}



button {

    width:100%;

    padding:14px;

    background:#00ffcc;

    color:black;

    border:none;

    border-radius:8px;

    font-weight:bold;

    cursor:pointer;

}


button:hover {

    background:#00e6b8;

}



a {

    color:#00ffcc;

    text-decoration:none;

}


.register {

    margin-top:25px;

    color:#cccccc;

}


</style>


</head>


<body>


<div class="container">


<h1>
Welcome Back
</h1>


<p class="subtitle">
Login to your account
</p>



<form id="loginForm">


<input

type="email"

id="email"

placeholder="Email address"

required>



<input

type="password"

id="password"

placeholder="Password"

required>



<button>

Login

</button>


</form>



<p class="register">

Don't have an account?

<a href="register.html">

Create one

</a>


</p>


</div>



<script>


document
.getElementById("loginForm")
.addEventListener("submit", async (e)=>{


e.preventDefault();



const response = await fetch("/login", {


method:"POST",


headers:{


"Content-Type":"application/json"

},


body:JSON.stringify({


email:
document.getElementById("email").value,


password:
document.getElementById("password").value


})


});



const data = await response.json();


if(data.message === "Login successful") {

    window.location.href = "profile.html";

}
else {

    alert(data.message);

}



});


</script>



</body>

</html>
