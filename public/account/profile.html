<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Account - Unnecessary Engineering</title>


<style>

body {

    margin:0;
    min-height:100vh;
    background:
    radial-gradient(circle at top left, rgba(0,255,204,0.12), transparent 25%),
    radial-gradient(circle at top right, rgba(125,211,252,0.10), transparent 25%),
    #06070b;

    color:white;

    font-family:
    Inter,
    Arial,
    sans-serif;

    display:flex;
    justify-content:center;
    align-items:center;

}


.account-container {

    width:100%;
    max-width:900px;

    padding:40px 20px;

}



.header-card {

    background:rgba(255,255,255,0.05);

    border:
    1px solid rgba(255,255,255,0.1);

    border-radius:30px;

    padding:35px;

    margin-bottom:25px;

    box-shadow:
    0 30px 80px rgba(0,0,0,0.3);

}



h1 {

    margin:0;

    font-size:3em;

}



h2 {

    color:#00ffcc;

    margin-top:40px;

}



p {

    color:#cccccc;

    line-height:1.6;

}



.profile-card {


    background:rgba(255,255,255,0.04);

    border:
    1px solid rgba(255,255,255,0.1);

    border-radius:30px;

    padding:35px;


}



.purchase {


    background:#11151c;

    border:
    1px solid rgba(255,255,255,0.08);

    border-radius:20px;

    padding:25px;

    margin-top:20px;


}



.purchase h3 {


    margin-top:0;

    color:white;


}



.btn {


    display:inline-block;

    margin-top:15px;

    padding:14px 28px;

    background:#00ffcc;

    color:black;

    text-decoration:none;

    border-radius:999px;

    font-weight:bold;

    transition:0.2s;


}



.btn:hover {


    transform:translateY(-3px);

    background:#00e6b8;


}



.back {


    display:block;

    margin-top:35px;

    color:#cccccc;

    text-decoration:none;


}



.back:hover {


    color:#00ffcc;


}



</style>


</head>



<body>



<div class="account-container">



<div class="header-card">


<h1>
My Account
</h1>


<p id="username">
Loading...
</p>


</div>





<div class="profile-card">



<h2>
Your Purchases
</h2>



<div id="purchases">

Loading purchases...

</div>



<a class="back" href="/">
← Back to Shop
</a>



</div>



</div>






<script>


fetch("/account/user")

.then(res => res.json())

.then(data => {


document.getElementById("username").innerHTML =

"Hello " + data.name + "!";


});






fetch("/account/purchases")

.then(res => res.json())

.then(products => {



const box = document.getElementById("purchases");



if(products.length === 0){


box.innerHTML="No purchases yet.";

return;


}




box.innerHTML="";



products.forEach(product => {


let downloads = [];


if(product.product_name === "MakerPlot 2.0 - Infinite"){

    downloads = [
        "MakerPlot 2.0 - Infinite",
        "MakerPlot 2.0 - A2",
        "MakerPlot 2.0 - A3",
        "MakerPlot 2.0 - A4"
    ];

}


else if(product.product_name === "MakerPlot 2.0 - A2"){

    downloads = [
        "MakerPlot 2.0 - A2",
        "MakerPlot 2.0 - A3",
        "MakerPlot 2.0 - A4"
    ];

}


else if(product.product_name === "MakerPlot 2.0 - A3"){

    downloads = [
        "MakerPlot 2.0 - A3",
        "MakerPlot 2.0 - A4"
    ];

}


else if(product.product_name === "MakerPlot 2.0 - A4"){

    downloads = [
        "MakerPlot 2.0 - A4"
    ];

}


else {

    downloads = [
        product.product_name
    ];

}



let buttons = "";


downloads.forEach(file => {


buttons += `

<a class="btn" href="/download/${encodeURIComponent(file)}" download>

Download ${file}

</a>

<br>

`;



});




box.innerHTML += `


<div class="purchase">


<h3>

${product.product_name}

</h3>


<p>

Purchase date:

${product.purchase_date}

</p>


${buttons}


</div>



`;



});



});



</script>



</body>

</html>
