<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Create Account - Unnecessary Engineering</title>


<style>

body {

    margin:0;
    min-height:100vh;
    background:
    radial-gradient(circle at top left, rgba(0,255,204,0.12), transparent 25%),
    radial-gradient(circle at top right, rgba(125,211,252,0.10), transparent 25%),
    #06070b;

    color:white;

    font-family:
    Inter,
    Arial,
    sans-serif;

    display:flex;
    align-items:center;
    justify-content:center;

}


.container {

    background:rgba(255,255,255,0.05);

    width:90%;
    max-width:420px;

    padding:40px;

    border-radius:30px;

    border:1px solid rgba(255,255,255,0.1);

    box-shadow:
    0 30px 80px rgba(0,0,0,0.3);

    text-align:center;

}


h1 {

    margin-bottom:10px;
    font-size:2em;
    color:white;

}


.subtitle {

    color:#cccccc;

    margin-bottom:30px;

}


input {

    width:100%;

    box-sizing:border-box;

    padding:14px;

    margin-bottom:15px;

    border-radius:999px;

    border:1px solid rgba(255,255,255,0.12);

    background:rgba(255,255,255,0.06);

    color:white;

    font-size:1em;

}


input:focus {

    outline:none;
    border-color:#00ffcc;
    box-shadow:0 0 0 2px rgba(0,255,204,0.18);

}


button {


    width:100%;

    padding:14px;

    background:#00ffcc;

    color:black;

    border:none;

    border-radius:999px;

    font-weight:bold;

    font-size:1em;

    cursor:pointer;

    transition:0.2s;


}


button:hover {

    background:#00e6b8;
    transform:translateY(-2px);

}


button:active {

    transform:translateY(0);

}


a {

    color:#00ffcc;

    text-decoration:none;

}


a:hover {

    color:#00e6b8;

}


.login {

    margin-top:25px;

    color:#cccccc;

}


</style>


</head>



<body>



<div class="container">


<h1>
Create Account
</h1>


<p class="subtitle">

Join Unnecessary Engineering

</p>



<form id="registerForm">


<input
type="text"
id="name"
placeholder="Your name"
required>



<input
type="email"
id="email"
placeholder="Email address"
required>



<input
type="password"
id="password"
placeholder="Password"
required>



<button type="submit">

Register

</button>


</form>



<p class="login">

Already have an account?

<a href="login.html">

Login

</a>


</p>



</div>





<script>


document
.getElementById("registerForm")
.addEventListener("submit", async (e)=>{


e.preventDefault();



const response = await fetch("/register", {


method:"POST",


headers:{


"Content-Type":"application/json"


},


body:JSON.stringify({


name:
document.getElementById("name").value,


email:
document.getElementById("email").value,


password:
document.getElementById("password").value


})


});



const data = await response.json();


alert(data.message);



});



</script>



</body>


</html>
