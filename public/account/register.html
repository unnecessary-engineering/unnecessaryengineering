<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Create Account - Unnecessary Engineering</title>


<style>

body {

    margin:0;
    font-family:Arial,sans-serif;
    background:#0f0f0f;
    color:white;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;

}


.container {

    background:#1a1a1a;

    width:90%;
    max-width:420px;

    padding:40px;

    border-radius:12px;

    box-shadow:
    0 10px 20px rgba(0,255,204,0.2);

    text-align:center;

}



h1 {

    margin-bottom:10px;
    font-size:2em;

}



.subtitle {

    color:#cccccc;

    margin-bottom:30px;

}



input {

    width:100%;

    box-sizing:border-box;

    padding:14px;

    margin-bottom:15px;

    border-radius:8px;

    border:none;

    background:#2a2a2a;

    color:white;

    font-size:1em;

}



input:focus {

    outline:2px solid #00ffcc;

}



button {


    width:100%;

    padding:14px;

    background:#00ffcc;

    color:black;

    border:none;

    border-radius:8px;

    font-weight:bold;

    font-size:1em;

    cursor:pointer;


}



button:hover {

    background:#00e6b8;

}



a {

    color:#00ffcc;

    text-decoration:none;

}



.login {

    margin-top:25px;

    color:#cccccc;

}



</style>


</head>



<body>



<div class="container">


<h1>
Create Account
</h1>


<p class="subtitle">

Join Unnecessary Engineering

</p>



<form id="registerForm">


<input
type="text"
id="name"
placeholder="Your name"
required>



<input
type="email"
id="email"
placeholder="Email address"
required>



<input
type="password"
id="password"
placeholder="Password"
required>



<button type="submit">

Register

</button>


</form>



<p class="login">

Already have an account?

<a href="login.html">

Login

</a>


</p>



</div>





<script>


document
.getElementById("registerForm")
.addEventListener("submit", async (e)=>{


e.preventDefault();



const response = await fetch("/register", {


method:"POST",


headers:{


"Content-Type":"application/json"


},


body:JSON.stringify({


name:
document.getElementById("name").value,


email:
document.getElementById("email").value,


password:
document.getElementById("password").value


})


});



const data = await response.json();


alert(data.message);



});



</script>



</body>


</html>
