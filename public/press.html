<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
Press & Media | Unnecessary Engineering
</title>

<meta name="description" content="
Articles, Kickstarter campaigns and media features about Unnecessary Engineering projects and MakerPlot CNC plotters.
">

<link rel="icon" type="image/png" href="/favicon.png">

<style>

:root{
  --bg:#06070b;
  --text:#f5f7fb;
  --muted:#cfd8e3;
  --accent:#00ffcc;
  --accent-2:#7dd3fc;
  --border:rgba(255,255,255,0.08);
  --shadow:0 30px 80px rgba(0,0,0,0.35);
}


*{
box-sizing:border-box;
}


body{

margin:0;

font-family:
Inter,
Arial,
sans-serif;

background:
radial-gradient(circle at top left, rgba(0,255,204,0.12), transparent 26%),
radial-gradient(circle at top right, rgba(125,211,252,0.12), transparent 24%),
var(--bg);

color:var(--text);

line-height:1.6;

}



a{
color:inherit;
text-decoration:none;
}



.container{

max-width:1240px;

margin:auto;

padding:40px 20px;

}



.header{

background:
rgba(255,255,255,0.05);

border:1px solid var(--border);

border-radius:32px;

padding:45px;

box-shadow:var(--shadow);

text-align:center;

}



h1{

font-size:3rem;

margin:0 0 15px;

}



.header p{

color:var(--muted);

font-size:1.1rem;

}




.grid{

display:grid;

grid-template-columns:
repeat(2,1fr);

gap:25px;

margin-top:30px;

}



.card{

background:
rgba(255,255,255,0.04);

border:1px solid var(--border);

border-radius:25px;

padding:30px;

box-shadow:var(--shadow);

}



.card h2{

color:var(--accent);

}



.card p{

color:var(--muted);

}



.btn{

display:inline-block;

margin-top:20px;

padding:14px 25px;

background:linear-gradient(
135deg,
var(--accent),
var(--accent-2)
);

color:#03110d;

border-radius:999px;

font-weight:bold;

}



.back{

display:block;

margin-top:40px;

color:var(--accent);

}



@media(max-width:800px){

.grid{

grid-template-columns:1fr;

}


h1{

font-size:2.2rem;

}

}


</style>


</head>


<body>


<div class="container">


<div class="header">


<h1>
Press & Media
</h1>


<p>
Articles, campaigns and features about
Unnecessary Engineering projects.
</p>


</div>



<div class="grid">


<!-- ARTICLES HERE -->


</div>



<a class="back" href="/">
← Back to homepage
</a>


</div>


</body>

</html>
